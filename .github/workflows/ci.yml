name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelz
          POSTGRES_PASSWORD: sentinelz
          POSTGRES_DB: sentinelz
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sentinelz
          MYSQL_DATABASE: sentinelz
          MYSQL_USER: sentinelz
          MYSQL_PASSWORD: sentinelz
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -psentinelz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

      mongo:
        image: mongo:7
        ports:
          - 57017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - run: yarn test

      - run: yarn test:integration
