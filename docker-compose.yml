services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinelz
      POSTGRES_PASSWORD: sentinelz
      POSTGRES_DB: sentinelz
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinelz']
      interval: 2s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sentinelz
      MYSQL_DATABASE: sentinelz
      MYSQL_USER: sentinelz
      MYSQL_PASSWORD: sentinelz
    ports:
      - '53306:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -psentinelz']
      interval: 2s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - '57017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand("ping").ok']
      interval: 2s
      timeout: 5s
      retries: 20
